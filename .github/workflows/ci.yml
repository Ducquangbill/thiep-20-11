name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run unit tests
        run: npm test

      - name: Enforce zero runtime dependencies
        run: >-
          node -e "const p=require('./package.json');
          if (p.dependencies || p.devDependencies || p.peerDependencies) {
            console.error('Static site must stay dependency-free');
            process.exit(1);
          }"

  package:
    name: package static artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: |
            index.html
            styles.css
            app.js
          if-no-files-found: error
          retention-days: 14
